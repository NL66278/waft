# Pre-commit hooks for the Open Eye Development Odoo 19 workspace.
# See AGENTS.md "Conventions" section for the rules enforced here.
#
# One-time setup (does NOT commit anything — just installs the git hook):
#   uvx pre-commit install
#   uvx pre-commit install --hook-type pre-push   # optional
#
# Run manually on all files (without committing):
#   uvx pre-commit run --all-files
#
# Note: pre-commit modifies staged files when autofixing; it does not commit
# anything itself. The user remains the one who runs `git commit` (per the
# repo AGENTS.md guard "The user commits themselves").

exclude: |
  (?x)^(
      # Symlinked scripts that point into gitignored waftlib/ — we don't
      # own that code, so don't lint it.
      build|
      common/build|
      common/build\.d/.*|
      common/entrypoint|
      common/entrypoint\.d/.*|
      \.env-default|
      \.python-version|
      install|migrate|odoo-service|run|shell|
      translate-modules|upgrade|initial-database
  )$

repos:
  # --- Generic file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-symlinks
      - id: check-shebang-scripts-are-executable

  # --- Python: lint + format (ruff, configured in ruff.toml) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Shell: static analysis ---
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # bootstrap is the only real shell script; the rest are symlinks
        # to waftlib (excluded above). Keep args minimal — bootstrap uses
        # /bin/sh and plain POSIX constructs.
        args: [--severity=warning]

  # --- YAML: lint (repos.yaml etc.) ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        # .env-shared / .env-default are shell-sourceable, not YAML.
        # requirements*.txt are not YAML either.
        exclude: |
          (?x)^(
              \.env-shared|\.env-default|
              requirements.*\.txt|
              LICENSE
          )$

  # --- Markdown: lint (line length is a soft convention — see AGENTS.md) ---
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        # MD013 = line length. We wrap to 88 by convention (see AGENTS.md)
        # but tables/code-blocks/URLs legitimately exceed it, so disable
        # the rule and rely on the manual convention instead.
        args: [--config, .markdownlint-cli2.jsonc]
